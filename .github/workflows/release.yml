name: Release Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binaries & Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y alien dpkg-dev rpm

      - name: Disable conflicting local Cargo configuration
        run: |
          if [ -f .cargo/config.toml ]; then
            mv .cargo/config.toml .cargo/config.toml.bak
            echo "Temporarily disabled .cargo/config.toml to prevent cross-compilation linker conflicts."
          fi

      - name: Build Linux x86_64
        run: cross build --release --target x86_64-unknown-linux-gnu

      - name: Build Linux Aarch64
        run: cross build --release --target aarch64-unknown-linux-gnu

      - name: Build Linux Armv7
        run: cross build --release --target armv7-unknown-linux-gnueabihf

      - name: Restore local Cargo configuration
        if: always()
        run: |
          if [ -f .cargo/config.toml.bak ]; then
            mv .cargo/config.toml.bak .cargo/config.toml
            echo "Restored .cargo/config.toml successfully."
          fi

      - name: Package .deb, .rpm, .AppImage, .tar.gz
        run: |
          mkdir -p dist

          # Copy binaries
          cp target/x86_64-unknown-linux-gnu/release/isearch-cli dist/isearch-linux-x86_64
          cp target/aarch64-unknown-linux-gnu/release/isearch-cli dist/isearch-linux-aarch64
          cp target/armv7-unknown-linux-gnueabihf/release/isearch-cli dist/isearch-linux-arm

          # Generate portable archives (old names for backward compatibility)
          tar -czf dist/isearch-linux-x86_64.tar.gz -C dist isearch-linux-x86_64
          tar -czf dist/isearch-linux-aarch64.tar.gz -C dist isearch-linux-aarch64
          tar -czf dist/isearch-linux-arm.tar.gz -C dist isearch-linux-arm

          # Generate portable archives (new consistent names)
          tar -czf dist/isearch-cli-linux-x64.tar.gz -C dist isearch-linux-x86_64
          tar -czf dist/isearch-cli-linux-arm64.tar.gz -C dist isearch-linux-aarch64
          tar -czf dist/isearch-cli-linux-arm.tar.gz -C dist isearch-linux-arm

          # Build Debian package (.deb)
          mkdir -p debian/DEBIAN
          mkdir -p debian/usr/bin
          cp target/x86_64-unknown-linux-gnu/release/isearch-cli debian/usr/bin/isearch
          cat <<EOF > debian/DEBIAN/control
          Package: isearch-cli
          Version: 0.1.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ErikrafT
          Description: Premium terminal browser and search assistant
          EOF
          dpkg-deb --build debian dist/isearch-cli-linux-amd64.deb
          cp dist/isearch-cli-linux-amd64.deb dist/isearch-linux-x86_64.deb

          # Convert to RedHat package (.rpm) using alien
          sudo alien --to-rpm --scripts dist/isearch-cli-linux-amd64.deb
          mv isearch-cli-*.rpm dist/isearch-cli-linux-amd64.rpm || mv isearch-*.rpm dist/isearch-cli-linux-amd64.rpm || true
          cp dist/isearch-cli-linux-amd64.rpm dist/isearch-linux-x86_64.rpm || true

          # Build AppImage Base Dir
          mkdir -p AppDir/usr/bin
          cp target/x86_64-unknown-linux-gnu/release/isearch-cli AppDir/usr/bin/isearch
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          exec "$APPDIR/usr/bin/isearch" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat <<'EOF' > AppDir/isearch.desktop
          [Desktop Entry]
          Type=Application
          Name=isearch
          Exec=isearch
          Icon=isearch
          Categories=Utility;
          EOF

          # Generate valid 1x1 transparent PNG icon dynamically without committing binary assets to Git
          python3 -c "import sys; open('AppDir/isearch.png', 'wb').write(bytes.fromhex('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000b49444154789cc5c0010d00000002000183b118af0000000049454e44ae426082'))"

          # Download and run appimagetool safely without FUSE dependencies
          curl -LO https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract

          # Build x86_64 AppImage
          ARCH=x86_64 ./squashfs-root/AppRun AppDir dist/isearch-cli-linux-x64.AppImage
          cp dist/isearch-cli-linux-x64.AppImage dist/isearch-linux-x86_64.AppImage

          # Build ARM64 AppImage
          mkdir -p AppDir-arm64/usr/bin
          cp target/aarch64-unknown-linux-gnu/release/isearch-cli AppDir-arm64/usr/bin/isearch
          cp AppDir/AppRun AppDir-arm64/
          cp AppDir/isearch.desktop AppDir-arm64/
          cp AppDir/isearch.png AppDir-arm64/

          ARCH=arm64 ./squashfs-root/AppRun AppDir-arm64 dist/isearch-cli-linux-arm64.AppImage

      - name: Upload Linux Assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: dist/*

  build-windows:
    name: Build Windows Binaries & Installers
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Windows x64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build Windows ARM64
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Diagnostics and Auditing
        shell: pwsh
        run: |
          Write-Host "=== Windows Environment Diagnostics ==="
          Write-Host "Checking for existing makensis..."
          try {
              $null = where.exe makensis 2>&1
          } catch {}
          Get-Command makensis -ErrorAction SilentlyContinue

          Write-Host "Checking for existing candle..."
          try {
              $null = where.exe candle 2>&1
          } catch {}

          Write-Host "Checking for existing light..."
          try {
              $null = where.exe light 2>&1
          } catch {}

          Write-Host "Listing current system PATH folders:"
          $env:PATH -split ';' | ForEach-Object { Write-Host "  $_" }

          # Explicitly force a success exit code so diagnostics never break the run
          $global:LASTEXITCODE = 0
          exit 0

      - name: Install WiX and NSIS
        shell: pwsh
        run: |
          Write-Host "=== Installing and Configuring NSIS ==="

          # Force install NSIS via Chocolatey to ensure it exists
          Write-Host "Installing NSIS via Chocolatey..."
          choco install nsis -y --no-progress

          # Search for makensis.exe in all possible locations
          $searchPaths = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe",
              "C:\ProgramData\chocolatey\bin\makensis.exe"
          )

          $makensisExe = $null
          foreach ($path in $searchPaths) {
              if (Test-Path $path) {
                  $makensisExe = $path
                  break
              }
          }

          if ($null -eq $makensisExe) {
              Write-Host "makensis.exe not found in quick search paths. Performing recursive search in C:\Program Files, C:\Program Files (x86), and C:\ProgramData..."
              $found = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)", "C:\ProgramData" -Filter "makensis.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                  $makensisExe = $found.FullName
              }
          }

          if ($null -eq $makensisExe) {
              Write-Error "NSIS installation failed! makensis.exe could not be found anywhere."
              exit 1
          }

          Write-Host "Found makensis.exe at: $makensisExe"

          # Test if the executable runs
          & "$makensisExe" /VERSION
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to execute makensis.exe!"
              exit 1
          }

          $nsisBinDir = Split-Path $makensisExe
          Write-Host "NSIS Directory: $nsisBinDir"

          # Add to system environment PATH for the current step (to be safe)
          $env:PATH = "$nsisBinDir;" + $env:PATH

          # Add to GITHUB_PATH and GITHUB_ENV without BOM
          Add-Content -Path $env:GITHUB_PATH -Value "$nsisBinDir"
          Add-Content -Path $env:GITHUB_ENV -Value "MAKENSIS_PATH=$makensisExe"

          Write-Host "=== Installing and Configuring WiX Toolset ==="
          Write-Host "Installing WiX Toolset via Chocolatey..."
          choco install wixtoolset -y --no-progress

          # Find candle.exe and light.exe
          $candleExe = $null
          $lightExe = $null

          $wixSearchDirs = @(
              "C:\Program Files (x86)\WiX Toolset v3.14\bin",
              "C:\Program Files (x86)\WiX Toolset v3.11\bin",
              "C:\Program Files\WiX Toolset v3.14\bin",
              "C:\Program Files\WiX Toolset v3.11\bin"
          )

          foreach ($dir in $wixSearchDirs) {
              $candlePath = Join-Path $dir "candle.exe"
              $lightPath = Join-Path $dir "light.exe"
              if ((Test-Path $candlePath) -and (Test-Path $lightPath)) {
                  $candleExe = $candlePath
                  $lightExe = $lightPath
                  break
              }
          }

          if ($null -eq $candleExe) {
              Write-Host "WiX bin dir not found in standard paths. Performing recursive search for candle.exe..."
              $foundCandle = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)", "C:\ProgramData" -Filter "candle.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($foundCandle) {
                  $candleExe = $foundCandle.FullName
                  $lightExe = Join-Path (Split-Path $candleExe) "light.exe"
              }
          }

          if ($null -eq $candleExe -or !(Test-Path $lightExe)) {
              Write-Error "WiX Toolset installation failed! candle.exe or light.exe could not be found."
              exit 1
          }

          Write-Host "Found candle.exe at: $candleExe"
          Write-Host "Found light.exe at: $lightExe"

          $wixBinDir = Split-Path $candleExe
          Write-Host "WiX Directory: $wixBinDir"

          # Add to system environment PATH for the current step (to be safe)
          $env:PATH = "$wixBinDir;" + $env:PATH

          # Add to GITHUB_PATH and GITHUB_ENV without BOM
          Add-Content -Path $env:GITHUB_PATH -Value "$wixBinDir"
          Add-Content -Path $env:GITHUB_ENV -Value "CANDLE_PATH=$candleExe"
          Add-Content -Path $env:GITHUB_ENV -Value "LIGHT_PATH=$lightExe"

      - name: Verify WiX and NSIS
        shell: pwsh
        run: |
          Write-Host "=== Verifying WiX and NSIS installation ==="

          $makensis = if ($env:MAKENSIS_PATH) { $env:MAKENSIS_PATH } else { "makensis.exe" }
          $candle = if ($env:CANDLE_PATH) { $env:CANDLE_PATH } else { "candle.exe" }
          $light = if ($env:LIGHT_PATH) { $env:LIGHT_PATH } else { "light.exe" }

          Write-Host "Using makensis path: $makensis"
          Write-Host "Using candle path: $candle"
          Write-Host "Using light path: $light"

          # Mandatory /VERSION and help checks
          Write-Host "Testing makensis..."
          & "$makensis" /VERSION
          if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL ERROR: makensis is not functioning correctly or not found."
              exit 1
          }

          Write-Host "Testing candle..."
          & "$candle" -?
          if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL ERROR: candle is not functioning correctly or not found."
              exit 1
          }

          Write-Host "Testing light..."
          & "$light" -?
          if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL ERROR: light is not functioning correctly or not found."
              exit 1
          }

          # Final validation that tools exist in PATH or as valid commands
          if (!(Get-Command $makensis -ErrorAction SilentlyContinue) -and !(Test-Path $makensis)) {
              Write-Error "CRITICAL ERROR: makensis could not be found or executed!"
              exit 1
          }
          if (!(Get-Command $candle -ErrorAction SilentlyContinue) -and !(Test-Path $candle)) {
              Write-Error "CRITICAL ERROR: candle could not be found or executed!"
              exit 1
          }
          if (!(Get-Command $light -ErrorAction SilentlyContinue) -and !(Test-Path $light)) {
              Write-Error "CRITICAL ERROR: light could not be found or executed!"
              exit 1
          }

          Write-Host "All tools verified successfully and are fully operational!"

      - name: Build Installers (.exe, .msi)
        shell: pwsh
        run: |
          $makensis = if ($env:MAKENSIS_PATH) { $env:MAKENSIS_PATH } else { "makensis" }
          $candle = if ($env:CANDLE_PATH) { $env:CANDLE_PATH } else { "candle" }
          $light = if ($env:LIGHT_PATH) { $env:LIGHT_PATH } else { "light" }

          mkdir dist -Force
          cp target/x86_64-pc-windows-msvc/release/isearch-cli.exe dist/isearch-windows-x86_64.exe

          # Compile NSIS Installer (.exe) and WiX (.msi) from inside scripts/ to resolve relative paths
          cd scripts
          & $makensis installer.nsi
          & $candle installer.wxs -o installer.wixobj
          & $light -ext WixUIExtension installer.wixobj -o ../dist/isearch-installer-x86_64.msi

          # Rename and package consistent artifact names
          cd ..
          cp dist/isearch-installer-x86_64.exe dist/isearch-cli-windows-x64.exe
          cp dist/isearch-installer-x86_64.msi dist/isearch-cli-windows-x64.msi

          # Create flat zip archives for portable targets to prevent nested empty folder structures
          mkdir temp-x64 -Force
          cp target/x86_64-pc-windows-msvc/release/isearch-cli.exe temp-x64/
          Compress-Archive -Path temp-x64/* -DestinationPath dist/isearch-cli-windows-x64.zip -Force

          mkdir temp-arm64 -Force
          cp target/aarch64-pc-windows-msvc/release/isearch-cli.exe temp-arm64/
          Compress-Archive -Path temp-arm64/* -DestinationPath dist/isearch-cli-windows-arm64.zip -Force

          rm -Recurse -Force temp-x64, temp-arm64

      - name: Upload Windows Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/*

  build-macos:
    name: Build macOS Binaries & Installers
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build macOS Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build macOS Apple Silicon
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package macOS Installers (.pkg, .dmg, .tar.gz)
        run: |
          mkdir dist
          cp target/x86_64-apple-darwin/release/isearch-cli dist/isearch-macos-x86_64
          cp target/aarch64-apple-darwin/release/isearch-cli dist/isearch-macos-aarch64

          # Package as .tar.gz (old names)
          tar -czf dist/isearch-macos-x86_64.tar.gz -C dist isearch-macos-x86_64
          tar -czf dist/isearch-macos-aarch64.tar.gz -C dist isearch-macos-aarch64

          # Package as .tar.gz (new consistent names)
          tar -czf dist/isearch-cli-macos-intel.tar.gz -C dist isearch-macos-x86_64
          tar -czf dist/isearch-cli-macos-arm64.tar.gz -C dist isearch-macos-aarch64

          # Package as .zip (new consistent names)
          zip -j dist/isearch-cli-macos-intel.zip target/x86_64-apple-darwin/release/isearch-cli
          zip -j dist/isearch-cli-macos-arm64.zip target/aarch64-apple-darwin/release/isearch-cli

          # Build Apple Silicon PKG
          mkdir -p osx-pkg-aarch64/usr/local/bin
          cp target/aarch64-apple-darwin/release/isearch-cli osx-pkg-aarch64/usr/local/bin/isearch
          pkgbuild --identifier com.erikraft.isearch.aarch64 --version 0.1.0 --install-location / --root osx-pkg-aarch64 dist/isearch-installer-macos-aarch64.pkg

          # Build Intel PKG
          mkdir -p osx-pkg-x86_64/usr/local/bin
          cp target/x86_64-apple-darwin/release/isearch-cli osx-pkg-x86_64/usr/local/bin/isearch
          pkgbuild --identifier com.erikraft.isearch.x86_64 --version 0.1.0 --install-location / --root osx-pkg-x86_64 dist/isearch-installer-macos-x86_64.pkg

          # Build DMG
          mkdir -p dmg-folder-x86_64
          cp target/x86_64-apple-darwin/release/isearch-cli dmg-folder-x86_64/isearch
          hdiutil create -volname "iSearch CLI x86_64" -srcfolder dmg-folder-x86_64 -ov -format UDZO dist/isearch-installer-macos-x86_64.dmg

          mkdir -p dmg-folder-aarch64
          cp target/aarch64-apple-darwin/release/isearch-cli dmg-folder-aarch64/isearch
          hdiutil create -volname "iSearch CLI aarch64" -srcfolder dmg-folder-aarch64 -ov -format UDZO dist/isearch-installer-macos-aarch64.dmg

      - name: Upload macOS Assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: dist/*

  build-android:
    name: Build Android Termux Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile native Android binaries
        run: |
          mkdir dist
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # 1. Compile for Android Aarch64 (ARM64)
          CLANG_AARCH64=$(find "$NDK_BIN" -name "aarch64-linux-android*-clang" | sort -V | tail -n 1)
          if [ -z "$CLANG_AARCH64" ]; then
            CLANG_AARCH64="$NDK_BIN/aarch64-linux-android33-clang"
          fi
          echo "Using Aarch64 clang: $CLANG_AARCH64"

          export CC_aarch64_linux_android="$CLANG_AARCH64"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG_AARCH64"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"

          cargo build --release --target aarch64-linux-android
          cp target/aarch64-linux-android/release/isearch-cli dist/isearch-linux-android-aarch64
          # Keep old name for backwards compatibility
          cp target/aarch64-linux-android/release/isearch-cli dist/isearch-linux-aarch64

          # 2. Compile for Android Armv7
          CLANG_ARMV7=$(find "$NDK_BIN" -name "armv7a-linux-androideabi*-clang" | sort -V | tail -n 1)
          if [ -z "$CLANG_ARMV7" ]; then
            CLANG_ARMV7="$NDK_BIN/armv7a-linux-androideabi33-clang"
          fi
          echo "Using Armv7 clang: $CLANG_ARMV7"

          export CC_armv7_linux_androideabi="$CLANG_ARMV7"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$CLANG_ARMV7"
          export AR_armv7_linux_androideabi="$NDK_BIN/llvm-ar"

          cargo build --release --target armv7-linux-androideabi
          cp target/armv7-linux-androideabi/release/isearch-cli dist/isearch-linux-android-armv7
          # Keep old name for backwards compatibility
          cp target/armv7-linux-androideabi/release/isearch-cli dist/isearch-linux-arm

          # 3. Compile for Android x86_64
          CLANG_X86_64=$(find "$NDK_BIN" -name "x86_64-linux-android*-clang" | sort -V | tail -n 1)
          if [ -z "$CLANG_X86_64" ]; then
            CLANG_X86_64="$NDK_BIN/x86_64-linux-android33-clang"
          fi
          echo "Using x86_64 clang: $CLANG_X86_64"

          export CC_x86_64_linux_android="$CLANG_X86_64"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$CLANG_X86_64"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"

          cargo build --release --target x86_64-linux-android
          cp target/x86_64-linux-android/release/isearch-cli dist/isearch-linux-android-x86_64
          # Keep old name for backwards compatibility
          cp target/x86_64-linux-android/release/isearch-cli dist/isearch-linux-x86_64

          # Package consistent Android release archives
          tar -czf dist/isearch-cli-termux-aarch64.tar.gz -C target/aarch64-linux-android/release isearch-cli
          tar -czf dist/isearch-cli-termux-arm.tar.gz -C target/armv7-linux-androideabi/release isearch-cli
          tar -czf dist/isearch-cli-termux-x64.tar.gz -C target/x86_64-linux-android/release isearch-cli

      - name: Upload Android Assets
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: dist/*

  release:
    name: Draft and Publish GitHub Release
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Assets
        uses: actions/download-artifact@v4
        with:
          name: linux-release-assets
          path: release-binaries

      - name: Download Windows Assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-binaries

      - name: Download macOS Assets
        uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: release-binaries

      - name: Download Android Assets
        uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: release-binaries

      - name: Copy Installer Script
        run: |
          cp scripts/install-termux.sh release-binaries/

      - name: Compute Checksums
        run: |
          cd release-binaries
          find . -type f -not -name "SHA256SUMS" -not -name "checksums.txt" -print0 | xargs -0 sha256sum | sed 's|^\./||' > SHA256SUMS
          cp SHA256SUMS checksums.txt
          echo "Checksums computed successfully."

      - name: Generate Release Notes
        run: |
          cat << 'EOF' > release_notes.md
          # iSearch CLI™ Release

          Official Author: ErikrafT
          Copyright: Copyright © 2026 ErikrafT

          ## Introduction
          This release contains the latest premium terminal browser and developer assistant - **iSearch CLI™**. All binaries, installers, and checksum files were built and verified entirely by GitHub Actions CI.

          ## Supported Platforms
          - **Linux (x86_64, aarch64, armv7):** Portable binary, `.deb`, `.rpm`, `.AppImage`, and `.tar.gz`
          - **Windows (x86_64):** Portable `.exe`, Installer executable, and `.msi`
          - **macOS (Intel, Apple Silicon):** Portable binaries, `.pkg` installers, `.dmg` files, and `.tar.gz`
          - **Android (Termux):** Custom installation via `install-termux.sh`

          ## Installation Methods

          ### 📦 Android Termux (Automatic Installation)
          ```bash
          curl -fsSL https://download.erikraft.com/install-termux.sh | bash
          ```
          Or using `wget`:
          ```bash
          wget -qO- https://download.erikraft.com/install-termux.sh | bash
          ```

          ### 📦 Manual Installation
          1. Download the compatible binary from the assets list below.
          2. Move the binary into your PATH (e.g. `/usr/local/bin` on Unix or `C:\Windows\System32` on Windows).
          3. Set permissions (`chmod +x`) and run `isearch`.

          ### 🔄 Updating
          To update your existing installation automatically, run:
          ```bash
          isearch self-update
          ```

          ## 🔒 Integrity and Verification
          Verify download integrity using SHA256 checksums:
          ```bash
          sha256sum --check SHA256SUMS
          ```

          Known issues and limitations are documented in the [docs/releases.md](https://download.erikraft.com/docs/releases.html).
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          body_path: release_notes.md
          files: |
            release-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
