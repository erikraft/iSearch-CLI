name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Binary & Installers
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Windows x64 Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build Windows ARM64 Binary
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Install WiX and NSIS
        shell: pwsh
        run: |
          Write-Host "=== Installing and Configuring NSIS & WiX ==="

          # Force install NSIS and WiX Toolset via Chocolatey
          choco install nsis wixtoolset -y --no-progress

          # Standard installation directories
          $nsisDirs = @(
              "C:\Program Files (x86)\NSIS",
              "C:\Program Files\NSIS",
              "C:\ProgramData\chocolatey\bin",
              "C:\ProgramData\chocolatey\lib\nsis\tools"
          )

          $wixDirs = @(
              "C:\Program Files (x86)\WiX Toolset v3.14\bin",
              "C:\Program Files (x86)\WiX Toolset v3.11\bin",
              "C:\Program Files (x86)\WiX Toolset v3.10\bin",
              "C:\Program Files\WiX Toolset v3.11",
              "C:\Program Files\WiX Toolset v3.14",
              "C:\Program Files\WiX Toolset v3.9\bin",
              "C:\Program Files\WiX Toolset v3.12\bin"
          )

          # Find NSIS directory
          $nsisDir = $null
          foreach ($dir in $nsisDirs) {
              if (Test-Path (Join-Path $dir "makensis.exe")) {
                  $nsisDir = $dir
                  break
              }
          }

          # If not found in standard paths, do a targeted recursive search inside Program Files
          if ($null -eq $nsisDir) {
              Write-Host "Performing targeted search for makensis.exe..."
              $found = Get-ChildItem -Path "C:\Program Files (x86)", "C:\Program Files", "C:\ProgramData" -Filter "makensis.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                  $nsisDir = Split-Path $found.FullName
              }
          }

          # Find WiX directory
          $wixDir = $null
          foreach ($dir in $wixDirs) {
              if ((Test-Path (Join-Path $dir "candle.exe")) -and (Test-Path (Join-Path $dir "light.exe"))) {
                  $wixDir = $dir
                  break
              }
          }

          # If not found in standard paths, do a targeted recursive search inside Program Files
          if ($null -eq $wixDir) {
              Write-Host "Performing targeted search for candle.exe..."
              $found = Get-ChildItem -Path "C:\Program Files (x86)", "C:\Program Files", "C:\ProgramData" -Filter "candle.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                  $wixDir = Split-Path $found.FullName
              }
          }

          if ($null -eq $nsisDir) {
              Write-Error "NSIS directory containing makensis.exe could not be found!"
              exit 1
          }
          if ($null -eq $wixDir) {
              Write-Error "WiX directory containing candle.exe / light.exe could not be found!"
              exit 1
          }

          Write-Host "Found NSIS Dir: $nsisDir"
          Write-Host "Found WiX Dir: $wixDir"

          # Add to GITHUB_PATH and GITHUB_ENV cleanly (using UTF-8 without BOM)
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllLines($env:GITHUB_PATH, [string[]]($nsisDir, $wixDir), $utf8NoBom)
          [System.IO.File]::AppendAllLines($env:GITHUB_ENV, [string[]]("MAKENSIS_PATH=$(Join-Path $nsisDir 'makensis.exe')", "CANDLE_PATH=$(Join-Path $wixDir 'candle.exe')", "LIGHT_PATH=$(Join-Path $wixDir 'light.exe')"), $utf8NoBom)

      - name: Verify WiX and NSIS
        shell: pwsh
        run: |
          Write-Host "=== Verifying WiX and NSIS installation ==="

          # Native PowerShell check to avoid external where.exe exit code issues
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if ($null -eq $makensis) {
              Write-Error "CRITICAL ERROR: makensis is not in the system PATH!"
              exit 1
          }
          Write-Host "makensis found at: $($makensis.Source)"

          $candle = Get-Command candle -ErrorAction SilentlyContinue
          if ($null -eq $candle) {
              Write-Error "CRITICAL ERROR: candle is not in the system PATH!"
              exit 1
          }
          Write-Host "candle found at: $($candle.Source)"

          $light = Get-Command light -ErrorAction SilentlyContinue
          if ($null -eq $light) {
              Write-Error "CRITICAL ERROR: light is not in the system PATH!"
              exit 1
          }
          Write-Host "light found at: $($light.Source)"

          # Run basic version check commands
          makensis /VERSION
          candle -?
          light -?

          Write-Host "All tools verified successfully!"

      - name: Build Installers (.exe, .msi)
        shell: pwsh
        run: |
          mkdir dist -Force
          cp target/x86_64-pc-windows-msvc/release/isearch-cli.exe dist/isearch-windows-x86_64.exe

          # Compile NSIS Installer (.exe) and WiX (.msi) from inside scripts/ to resolve relative paths
          cd scripts

          Write-Host "Compiling NSIS installer..."
          makensis installer.nsi
          if ($LASTEXITCODE -ne 0) {
              Write-Error "NSIS compilation failed!"
              exit 1
          }

          Write-Host "Compiling WiX installer..."
          candle installer.wxs -o installer.wixobj
          if ($LASTEXITCODE -ne 0) {
              Write-Error "WiX compilation (candle) failed!"
              exit 1
          }
          light -ext WixUIExtension installer.wixobj -o ../dist/isearch-installer-x86_64.msi
          if ($LASTEXITCODE -ne 0) {
              Write-Error "WiX compilation (light) failed!"
              exit 1
          }

          # Rename artifacts to consistent names
          cd ..
          cp dist/isearch-installer-x86_64.exe dist/isearch-cli-windows-x64.exe
          cp dist/isearch-installer-x86_64.msi dist/isearch-cli-windows-x64.msi

          # Create flat zip archives for portable targets to prevent nested empty folder structures
          mkdir temp-x64 -Force
          cp target/x86_64-pc-windows-msvc/release/isearch-cli.exe temp-x64/
          Compress-Archive -Path temp-x64/* -DestinationPath dist/isearch-cli-windows-x64.zip -Force

          mkdir temp-arm64 -Force
          cp target/aarch64-pc-windows-msvc/release/isearch-cli.exe temp-arm64/
          Compress-Archive -Path temp-arm64/* -DestinationPath dist/isearch-cli-windows-arm64.zip -Force

          rm -Recurse -Force temp-x64, temp-arm64

      - name: Upload Windows Portable Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: isearch-windows-x86_64.exe
          path: target/x86_64-pc-windows-msvc/release/isearch-cli.exe

      - name: Upload Windows Consistent Assets
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/*
